name: Sync OP CARD VAULT

on:
  schedule:
    # 10:15, 15:15, 18:15, 21:15 JST every day
    - cron: '15 1,6,9,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the latest published files and SEO pages
        run: |
          git clone --depth 1 https://github.com/anadayo/pokeca-vault.git /tmp/pokeca-vault-source
          cp /tmp/pokeca-vault-source/onepiece-card-vault/index.html index.html
          cp /tmp/pokeca-vault-source/onepiece-card-vault/cards.json cards.json
          cp /tmp/pokeca-vault-source/onepiece-card-vault/adsense.js adsense.js
          cp /tmp/pokeca-vault-source/onepiece-card-vault/privacy.html privacy.html
          cp /tmp/pokeca-vault-source/onepiece-card-vault/assets/ogp.png ogp.png
          cp /tmp/pokeca-vault-source/onepiece-card-vault/sitemap.xml sitemap.xml
          cp /tmp/pokeca-vault-source/onepiece-card-vault/robots.txt robots.txt
          mkdir -p cards
          cp -R /tmp/pokeca-vault-source/onepiece-card-vault/cards/. ./cards/
          mkdir -p data
          cp -R /tmp/pokeca-vault-source/onepiece-card-vault/data/. ./data/
          test "$(find cards -mindepth 2 -name index.html | wc -l)" -ge 100

      - name: Publish changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync latest OP CARD VAULT data'
          file_pattern: index.html cards.json adsense.js privacy.html ogp.png sitemap.xml robots.txt cards/** data/**
